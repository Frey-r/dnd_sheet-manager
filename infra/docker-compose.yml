services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dnd_postgres
    environment:
      POSTGRES_DB: dndmanager
      POSTGRES_USER: dnduser
      POSTGRES_PASSWORD: dndsharp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnduser -d dndmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dnd_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata: