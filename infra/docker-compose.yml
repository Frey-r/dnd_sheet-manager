services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dnd_postgres
    environment:
      POSTGRES_DB: dndmanager
      POSTGRES_USER: dnduser
      POSTGRES_PASSWORD: dndsharp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnduser -d dndmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dnd_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Foundry VTT REST API relay (https://github.com/ThreeHats/foundryvtt-rest-api-relay).
  # The Foundry world's foundryvtt-rest-api module connects here over WebSocket;
  # this backend reads it over REST. See openspec/specs/foundry-integration.md.
  # NOTE: confirm the published image/tag for your relay version.
  foundry-relay:
    image: ghcr.io/threehats/foundryvtt-rest-api-relay:latest
    container_name: dnd_foundry_relay
    ports:
      - "3010:3010"
    environment:
      PORT: "3010"
      # API key the relay accepts; the Go backend sends it as x-api-key.
      API_KEY: ${FOUNDRY_API_KEY:-change-me}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: