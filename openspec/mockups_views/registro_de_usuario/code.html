<style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
        .input-well {
            background-color: #F6F6F6;
            border-bottom: 1px solid #E2E2E2;
            transition: border-color 0.2s ease;
        }
        .input-well:focus-within {
            border-bottom-color: #276EF1;
        }
        .input-field {
            background: transparent;
            border: none;
            box-shadow: none;
        }
        .input-field:focus {
            outline: none;
            box-shadow: none;
            border-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col md:flex-row">
<!-- Hero / Brand Section (Hidden on small mobile, visible on larger screens) -->
<div class="hidden md:flex md:w-1/2 bg-surface-container-lowest border-r border-border-low-contrast relative overflow-hidden items-center justify-center p-margin-desktop">
<!-- Abstract Brand Background -->
<div class="absolute inset-0 bg-cover bg-center opacity-90" data-alt="A macro photograph of intricately carved, multi-sided polyhedral dice resting on a highly structured, metallic surface. The scene is illuminated by crisp, cold white light with stark, high-contrast shadows, emphasizing a 'Systematic, Authoritative' mood. The color palette focuses on deep blacks, sharp whites, and subtle hints of primary blue, conveying a corporate modern approach to tabletop gaming logistics." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDY2szT8Q8drANQnT_pNIfhTAspaRWho-8XZKJfeXGYFjjikL6cP94vm1DiyNFbLnRgG8FQFugsFeIPtdB_ZicVh1SwV1RWSjKL3GiEZU_lkdKtOWO_hfrLMcSqtrTVLOZz-Rms_9PiqxuCDBYrTlQdFwySvNDnJMbXzjEg9SLuhgbNTKeJaQd7xnSWhALUt4xh8iQqnjP-fmXj6z8yJztrwQbiBj03ic_icVq21Tj04yqpBMtPAtbAOgM-i4A1g3src6-5PTkBWA');">
</div>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest to-transparent"></div>
<div class="relative z-10 text-center max-w-md">
<h1 class="font-display-lg text-display-lg text-on-background mb-lg">Campaign Master</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Logistics, stats, and coordination for high-stakes campaigns. Precision focused, data driven.</p>
</div>
</div>
<!-- Registration Form Section -->
<div class="w-full md:w-1/2 flex flex-col justify-center px-margin-mobile md:px-margin-desktop py-xl">
<!-- Mobile Header (Visible only on mobile) -->
<div class="md:hidden text-center mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Campaign Master</h1>
</div>
<div class="max-w-md w-full mx-auto">
<div class="mb-xl">
<h2 class="font-headline-lg text-headline-lg md:text-display-lg md:font-display-lg mb-sm">Crear Cuenta</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Ingresa tus datos para establecer una nueva sesión.</p>
</div>
<form class="space-y-lg">
<!-- Username Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-xs" for="username">Usuario</label>
<div class="input-well rounded-t-DEFAULT px-md py-sm">
<div class="flex items-center">
<span class="material-symbols-outlined text-outline mr-sm">person</span>
<input class="input-field w-full font-body-md text-body-md text-on-background placeholder-outline-variant" id="username" name="username" placeholder="Nombre de usuario" required="" type="text"/>
</div>
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-xs" for="email">Correo Electrónico</label>
<div class="input-well rounded-t-DEFAULT px-md py-sm">
<div class="flex items-center">
<span class="material-symbols-outlined text-outline mr-sm">mail</span>
<input class="input-field w-full font-body-md text-body-md text-on-background placeholder-outline-variant" id="email" name="email" placeholder="correo@ejemplo.com" required="" type="email"/>
</div>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-xs" for="password">Contraseña</label>
<div class="input-well rounded-t-DEFAULT px-md py-sm">
<div class="flex items-center justify-between">
<div class="flex items-center w-full">
<span class="material-symbols-outlined text-outline mr-sm">lock</span>
<input class="input-field w-full font-body-md text-body-md text-on-background placeholder-outline-variant" id="password" name="password" placeholder="Mínimo 8 caracteres" required="" type="password"/>
</div>
<button class="text-outline hover:text-primary transition-colors focus:outline-none" onclick="togglePassword('password', 'pwd-icon-1')" type="button">
<span class="material-symbols-outlined" id="pwd-icon-1">visibility</span>
</button>
</div>
</div>
</div>
<!-- Confirm Password Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-xs" for="confirm_password">Confirmar Contraseña</label>
<div class="input-well rounded-t-DEFAULT px-md py-sm">
<div class="flex items-center justify-between">
<div class="flex items-center w-full">
<span class="material-symbols-outlined text-outline mr-sm">lock_reset</span>
<input class="input-field w-full font-body-md text-body-md text-on-background placeholder-outline-variant" id="confirm_password" name="confirm_password" placeholder="Repite la contraseña" required="" type="password"/>
</div>
<button class="text-outline hover:text-primary transition-colors focus:outline-none" onclick="togglePassword('confirm_password', 'pwd-icon-2')" type="button">
<span class="material-symbols-outlined" id="pwd-icon-2">visibility</span>
</button>
</div>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full bg-primary-container text-on-primary-container font-label-bold text-label-bold py-md rounded-DEFAULT hover:bg-primary transition-colors active:scale-95 shadow-sm flex justify-center items-center" type="submit">
                        Crear Cuenta
                    </button>
</div>
</form>
<!-- Login Link -->
<div class="mt-xl text-center">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors" href="#">
                    ¿Ya tienes cuenta? <span class="font-semibold text-primary-container">Inicia sesión</span>
</a>
</div>
</div>
</div>
<script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.textContent = "visibility_off";
            } else {
                input.type = "password";
                icon.textContent = "visibility";
            }
        }
    </script>
</body></html>
