<style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased">
<!-- Suppressed Nav Shells due to Transactional/Linear Intent (Login) -->
<!-- Main Content Area -->
<main class="flex-grow flex flex-col md:flex-row min-h-screen w-full">
<!-- Left Side: Visual / Brand Area (Hidden on small mobile, visible on md+) -->
<div class="hidden md:flex md:w-1/2 lg:w-[55%] relative overflow-hidden bg-surface-container-lowest border-r border-border-low-contrast items-center justify-center p-xl">
<!-- Decorative background pattern or image representing the "systematic" nature of the tool -->
<div class="absolute inset-0 z-0">
<img alt="Abstract systematic data representation" class="w-full h-full object-cover opacity-60" data-alt="A clean, highly structured abstract architectural or geometric scene representing systematic data organization. The environment features pristine white surfaces, subtle drop shadows, and striking lines, creating a deeply modern, corporate aesthetic suitable for a high-efficiency logistics or campaign management tool. The lighting is crisp and cool, casting precise shadows that define form without overwhelming detail. Subtle hints of deep primary blue (#0055cd) accent the otherwise monochromatic white and gray environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAR7DVkr6X1n_LRCDSrA5tWLpixZJfs0OkvFPpcPe-4lMV9u8AU-SIhecVhP77PeJj0aLNTw--R4GTMV5EaY3QDbnPZk2hNYpIjBGnI8DiFDMJS8j-aEoijKpmF5V5w-ZG52O6QZT9sxT5_n5o6MLU5cZ6b_ZHorbOLE1gQG1icXVKHfwI_fQ4ZemfYhKu2dITie6OG4av17UTZIb1GcfFpK9xur1caK4ErXXBe0ifCKMgBgJVgfuvkl2th5-A3gkWh6VhutuKu2Q"/>
<div class="absolute inset-0 bg-gradient-to-r from-surface/90 to-surface/40"></div>
</div>
<div class="relative z-10 max-w-lg text-center md:text-left">
<div class="flex items-center gap-sm mb-lg">
<span class="material-symbols-outlined text-primary text-[40px]" data-icon="hub">hub</span>
<span class="font-headline-lg text-headline-lg font-bold tracking-tight text-on-surface">Campaign Manager</span>
</div>
<h2 class="font-display-lg text-display-lg text-on-surface mb-md">Gestión táctica,<br/>precisión total.</h2>
<p class="font-body-lg text-body-lg text-secondary">Accede a tus datos de campaña, registros de combate y notas del DM en una plataforma diseñada para la eficiencia y la claridad.</p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full md:w-1/2 lg:w-[45%] flex flex-col justify-center px-margin-mobile py-xl md:px-xl lg:px-[10%] bg-surface-container-lowest">
<!-- Mobile Brand Logo (Visible only on mobile) -->
<div class="md:hidden flex items-center gap-sm mb-xl">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="hub">hub</span>
<span class="font-headline-md-mobile text-headline-md-mobile font-bold tracking-tight text-on-surface">Campaign Manager</span>
</div>
<div class="w-full max-w-md mx-auto md:mx-0">
<h1 class="font-display-lg text-display-lg md:text-[44px] text-[36px] font-extrabold tracking-tight text-on-surface mb-lg leading-tight">Bienvenido de nuevo</h1>
<form action="#" class="space-y-lg" method="POST">
<!-- Email Input Group -->
<div class="relative pt-6">
<input class="base-input peer block w-full px-4 py-3 font-body-md text-body-md text-on-surface rounded-t-DEFAULT" id="email" name="email" placeholder=" " required="" type="email"/>
<label class="floating-label absolute left-4 top-8 font-body-md text-body-md text-on-surface-variant peer-focus:text-primary" for="email">
                            Correo electrónico
                        </label>
</div>
<!-- Password Input Group -->
<div class="relative pt-6">
<input class="base-input peer block w-full px-4 py-3 font-body-md text-body-md text-on-surface rounded-t-DEFAULT" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="floating-label absolute left-4 top-8 font-body-md text-body-md text-on-surface-variant peer-focus:text-primary" for="password">
                            Contraseña
                        </label>
<button aria-label="Mostrar contraseña" class="absolute right-4 top-9 text-secondary hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-sm">
<label class="flex items-center cursor-pointer group">
<div class="relative flex items-center justify-center w-5 h-5 mr-sm rounded border border-outline bg-surface-subtle group-hover:border-primary transition-colors">
<input class="peer sr-only" id="remember" name="remember" type="checkbox"/>
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 absolute inset-0 flex items-center justify-center bg-primary rounded border-primary pointer-events-none transition-opacity" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant select-none">Recordarme</span>
</label>
<a class="font-label-bold text-label-bold text-primary hover:text-on-primary-fixed-variant transition-colors underline-offset-4 hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
<!-- Submit Button -->
<div class="pt-md">
<button class="w-full flex justify-center items-center py-4 px-6 border border-transparent rounded-DEFAULT shadow-sm font-label-bold text-label-bold text-on-primary bg-primary-container hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                            Iniciar Sesión
                            <span class="material-symbols-outlined ml-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Sign Up Link -->
<div class="mt-lg text-center md:text-left">
<p class="font-body-md text-body-md text-secondary">
                        ¿No tienes cuenta? 
                        <a class="font-label-bold text-label-bold text-primary hover:text-on-primary-fixed-variant transition-colors underline-offset-4 hover:underline ml-xs" href="#">Regístrate</a>
</p>
</div>
</div>
</div>
</main>
<!-- Optional micro-interaction script for the password toggle (purely visual for the prototype) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.querySelector('button[aria-label="Mostrar contraseña"]');
            const passwordInput = document.getElementById('password');
            const icon = togglePasswordBtn.querySelector('.material-symbols-outlined');

            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                icon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
        });
    </script>
