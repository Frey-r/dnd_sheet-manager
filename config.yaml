server:
  host: "0.0.0.0"
  port: 8080
  # Reverse proxies whose X-Forwarded-For is trusted (e.g. the cloudflared container IP).
  # Empty: the client IP is the TCP peer. Env override: TRUSTED_PROXIES=a,b
  trusted_proxies: []

database:
  dsn: "postgres://dnduser:dndsharp@localhost:5432/dndmanager?sslmode=disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300

redis:
  addr: "localhost:6379"
  db: 0

jwt:
  secret: "change-this-in-production-use-env-var"
  ttl: 3600
  refresh_ttl: 86400

ollama:
  base_url: "http://localhost:11434"
  embedding_model: "nomic-embed-text"
  llm_model: "llama3.2"
  timeout: 10

worker:
  pool_size: 4
  queue_depth: 100

rate_limit:
  requests_per_minute: 100
  ws_messages_per_second: 5
  ws_burst_seconds: 1
  ws_ban_seconds: 30
  foundry_sync_per_minute: 5
  audit_buffer_size: 1000
  burst:                       # token-bucket capacity per endpoint category
    auth: 20
    read: 100
    write: 60
    foundry: 10

foundry:
  relay_base_url: "http://localhost:3010"   # self-hosted foundryvtt-rest-api-relay
  api_key: ""                                # set via env FOUNDRY_API_KEY (do not commit)
  client_id: ""                              # connected world id; set via env FOUNDRY_CLIENT_ID
  default_lore_tier: "campaign_plot"
  sync_compendium: true
  frame_ancestors: []                        # origins allowed to iframe this app (no wildcards); env FOUNDRY_FRAME_ANCESTORS
  timeout: 30